          $summaryLines -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: ⏳ Show Access Info & Keep Alive
        shell: pwsh
        run: |
          $passwordMode = '${{ inputs.rdp_password_mode }}'

          if ($passwordMode -eq "same_from_secret") {
            $passwordForDisplay = "Use GitHub Secret RDP_PASSWORD"
          } else {
            $passwordForDisplay = $env:RDP_PASSWORD
          }

          function Logout-TailscaleSafely {
            $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

            if (Test-Path $tsExe) {
              Write-Host "Logging out from Tailscale..."
              & $tsExe logout

              if ($LASTEXITCODE -eq 0) {
                Write-Host "✅ Tailscale logout completed"
              } else {
                Write-Warning "Tailscale logout returned exit code $LASTEXITCODE"
              }
            } else {
              Write-Host "tailscale.exe not found. Skipping logout."
            }
          }

          Write-Host ""
          Write-Host "╔══════════════════════════════════════╗"
          Write-Host "║          WINDOWS RDP READY           ║"
          Write-Host "╠══════════════════════════════════════╣"
          Write-Host "║  Hostname : $env:TAILSCALE_HOSTNAME"
          Write-Host "║  IP       : $env:TAILSCALE_IP"
          Write-Host "║  Username : $env:RDP_USER"
          Write-Host "║  Password : $passwordForDisplay"
          Write-Host "╚══════════════════════════════════════╝"
          Write-Host ""

          try {
            $hours = [int]'${{ inputs.duration_hours }}'
            $seconds = $hours * 3600
            $elapsed = 0

            while ($elapsed -lt $seconds) {
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] ✅ Session active - elapsed $elapsed seconds"
              Start-Sleep -Seconds 300
              $elapsed += 300
            }

            Write-Host "Session completed."
          } finally {
            Logout-TailscaleSafely
          }

      - name: 🧹 Cleanup Tailscale Logout
        if: always()
        shell: pwsh
        run: |
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (Test-Path $tsExe) {
            Write-Host "Running final Tailscale cleanup/logout..."
            & $tsExe logout

            if ($LASTEXITCODE -eq 0) {
              Write-Host "✅ Final Tailscale logout completed"
            } else {
              Write-Warning "Final Tailscale logout returned exit code $LASTEXITCODE"
            }
          } else {
            Write-Host "tailscale.exe not found. Skipping final cleanup."
          }
